<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Supermax Demo</title>
		<link rel="icon" href="data:,">
		<link rel="stylesheet" href="./assets/supermax/workspace.css">
		<link rel="stylesheet" href="./assets/demo.css">
	</head>
	<body>
		<div class="shell">
			<header class="topbar">
				<div class="brand">
					<h1>Supermax</h1>
					<p>Branching rows with one Back history, computed per viewport.</p>
				</div>
				<a class="github-link" href="https://github.com/laicluse/supermax">GitHub</a>
			</header>
			<main class="demo">
				<aside class="controls" aria-label="Demo controls">
					<section class="control-group">
						<div class="label">Scenarios</div>
						<div class="scenario-list" data-scenarios></div>
					</section>
					<section class="control-group">
						<div class="label">Frame sizes</div>
						<div class="size-presets" data-size-presets></div>
					</section>
					<section class="control-group">
						<div class="label">Network</div>
						<label class="field">Delay <select data-delay><option value="0">none</option><option value="400">400 ms</option><option value="1500">1500 ms</option></select></label>
						<label class="field">Fail <select data-fail><option value="">nothing</option><option value="manifest">layout metadata</option><option value="content">content</option><option value="all">both</option></select></label>
						<label class="field">Viewer <select data-context><option value="ana">Ana</option><option value="ben">Ben</option></select></label>
					</section>
					<section class="control-group">
						<div class="label">Presentation</div>
						<label class="field">Motion <select data-presentation><option value="slide">Slide</option><option value="fold">Fold</option></select></label>
						<div class="requests" data-requests aria-live="polite"></div>
					</section>
					<section class="control-group">
						<button class="reset" type="button" data-reset>Reset scenario</button>
					</section>
				</aside>
				<section class="stage" aria-label="Paired viewports">
					<div class="frames" data-frames></div>
				</section>
			</main>
		</div>
		<script type="module" src="./assets/demo.js"></script>
	</body>
</html>
