<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Supermax Demo</title>
		<link rel="icon" href="data:,">
		<link rel="stylesheet" href="./assets/supermax/workspace.css">
		<link rel="stylesheet" href="./assets/demo.css">
	</head>
	<body>
		<div class="shell">
			<header class="topbar">
				<div class="brand">
					<h1>Supermax</h1>
					<p>Branching rows with one Back history, computed per viewport.</p>
				</div>
				<a class="github-link" href="https://github.com/laicluse/supermax">GitHub</a>
			</header>
			<main class="demo">
				<aside class="controls" aria-label="Demo controls">
					<section class="control-group">
						<div class="label">Scenarios</div>
						<div class="scenario-list" data-scenarios></div>
					</section>
					<section class="control-group">
						<div class="label">Frame sizes</div>
						<div class="size-presets" data-size-presets></div>
					</section>
					<section class="control-group">
						<button class="reset" type="button" data-reset>Reset scenario</button>
					</section>
					<section class="control-group explain">
						<p>Both frames receive every click and Back. Each frame computes its own layout, auto-opening and Back history from its own size. Drag a frame's bottom-right corner to resize it.</p>
					</section>
				</aside>
				<section class="stage" aria-label="Paired viewports">
					<div class="frames" data-frames></div>
				</section>
			</main>
		</div>
		<script type="module" src="./assets/demo.js"></script>
	</body>
</html>
