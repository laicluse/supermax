<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cell sweep fixture</title>
<link rel="stylesheet" href="/src/workspace.css">
<link rel="stylesheet" href="/src/default-renderer.css">
<style>html, body { height: 100%; margin: 0; } #host { height: 100%; }</style>
</head>
<body>
<div id="host"></div>
<script type="module">
import { Navigator, Workspace } from "/src/index.js";

const navigator = new Navigator({
	root: "rail",
	minViewportHeight: 300,
	destinations: {
		rail: { title: "Rail", min: 84, max: 84 },
		menu: { title: "Menu", min: 160, max: 240, preferred: 200, variants: [{ id: "labels", when: { minWidth: 160 } }, { id: "icons", min: 80, preferred: 80, max: 159 }] },
		board: { title: "Board", rows: [
			{ destination: "lanes", minHeight: 120, maxHeight: "*", preferredHeight: 300 },
			{ destination: "summary", minHeight: 80, maxHeight: 260, preferredHeight: 160 },
		] },
		lanes: { title: "Lanes", min: 200, max: 420, preferred: 300 },
		summary: { title: "Summary", min: 200, max: 420, preferred: 300 },
		detail: { title: "Detail", min: 240, max: "*", preferred: 400, placement: "beside-split" },
	},
});
const workspace = new Workspace(document.getElementById("host"), {
	navigator,
	content(occurrence) {
		const element = document.createElement("p");
		element.textContent = occurrence.title;
		return { element };
	},
});
workspace.sync(["rail", "menu", "board", "lanes", "detail"], { animate: false, origin: null });
</script>
</body>
</html>
